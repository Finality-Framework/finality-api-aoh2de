buildscript {
    dependencies {
        classpath files('libs/finality-gradle-1.0.0.jar')
    }
}

plugins {
    id 'java'
}

apply plugin: 'team.rainfall.finality.gradle'

sourceSets {
    main {
        java {
            exclude 'team/rainfall/finality/FinalityLogger.java'
            exclude 'team/rainfall/finality/loader/**'
            exclude 'team/rainfall/finality/luminosity2/**'
        }
    }
}

group = 'team.rainfall.finality'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly fileTree(dir: 'libs', includes: ['finality-loader-*.jar', 'game.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

finality {
    name = 'Finality API for AoH2DE'
    id = 'team.rainfall.finality.api.aoh2de'
    version = project.version.toString()
    description = 'Finality Framework 2 API for Age of History II: Definitive Edition.'
    mainClass = 'team.rainfall.finality.api.FinalityAPIPlugin'
    mixins = [
            'team.rainfall.finality.api.mixin.MixinAA_Game',
            'team.rainfall.finality.api.mixin.MixinFileManager',
            'team.rainfall.finality.api.mixin.MixinMenuManager',
            'team.rainfall.finality.api.mixin.MixinSteamManager'
    ]
}
